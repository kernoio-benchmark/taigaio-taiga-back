services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=taiga"
      - "POSTGRES_PASSWORD=taiga_password"
      - "POSTGRES_DB=taiga"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U taiga -d taiga"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/taiga?user=taiga&password=taiga_password

  redis:
    image: redis:8.4.0-alpine
    pull_policy: missing
    ports:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
    labels:
      - external-url=redis://localhost:{{PORT}}

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - RABBITMQ_DEFAULT_USER=taiga
      - RABBITMQ_DEFAULT_PASS=taiga_password
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672"
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - ping
      interval: 5s
      timeout: 10s
      retries: 10
    tmpfs:
      - /var/lib/rabbitmq
    labels:
      - external-url=amqp://taiga:taiga_password@localhost:{{PORT}}/

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
      additional_contexts:
        output: /tmp/compose17505464452614884728/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8000/api/v1/ || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
